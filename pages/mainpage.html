<!DOCTYPE html>
<html>
    <head>
        <title> 
            Library Login
        </title>
    </head>

    
    <body style="background-image: url(https://amu.edu.my/wp-content/uploads/2025/07/AMU-Campus-Life-Library-FI.png);
                background-size:cover;
                background-repeat: no-repeat;
                background-position: center;
                height: 100vh;
                margin: 0;">

    <table width="100%" height="600">
        <tr>
            <td width="15%"></td>
            <td align="top">
        

    <br><br><br><br><br><br><br>

        <form action="savelogin.php" method="POST">
            
        <table bgcolor="#EBE6E5" border="0">
            <tr>
                <td>
                    <h1>Library Login</h1>
        
        <fieldset style="width:350px; height:300px; background-color:#F5F3EF;";>
            

            <br>

            StudentID:<br>
            <input type="text" name="studentid" placeholder="e.g., SWE24070028" required>
            <br><br>

             Username:<br>
            <input type="text" name="username" placeholder="A-Z, a-z, 0-9" required pattern="[A-Za-z0-9]{4,}">
            <br><br>

            Password:<br>
            <input type="password" name="password" placeholder="Minimum 6 characters" required minlength="6">
            <br><br>


            Gender:
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
            <br><br>

            <input type="submit" value="Login">
            <input type="reset" value="Clear">

            <br><br>
        
        </fieldset>
        </form>
            </td>
        </tr>
    </table>
    </body>
</html>
